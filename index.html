<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Orçamento Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    
    <h1>Orçamento Fácil</h1>

    <p>Selecione o serviço desejado e receba seu orçamento.</p>

    <div class="orcamento">

        <label for="nome">Seu nome</label>

        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="servico">Escolha o serviço:</label>

        <select  id="servico">
           <option value="">Selecione...</option>

           <option value="150">Limpeza residencial - R$ 150</option>

           <option value="250">Limpeza comercial - R$ 250</option>

           <option value="450">Limpeza pós-obra - R$ 450</option>
        </select>

        <label for="quantidade">Quantidade</label>

        <input type="number" id="quantidade" value="1"
        min="1">

        <button id="Calcular">Calcular orçamento</button>

        <button id="whatsapp" class="botao-whatsapp">Enviar pelo WwhatsApp</button>

        <div id="resultado">
            <p>O valor do orçamento aparecerá aqui.</p>
        </div>

    
    </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
